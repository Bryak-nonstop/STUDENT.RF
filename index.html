<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Студент.РФ — единая платформа образования</title>
<style>
/* ============ токены ============ */
:root{
  --ink:#14213A;
  --ink-2:#54637E;
  --ink-3:#8593AB;
  --line:#DCE3ED;
  --line-2:#EDF1F6;
  --bg:#F1F4F9;
  --surface:#FFFFFF;
  --brand:#123E8C;
  --brand-2:#2C6BE8;
  --brand-soft:#EAF0FD;
  --ok:#0F7A4D;
  --ok-soft:#E6F5ED;
  --warn:#9A6100;
  --warn-soft:#FDF3E2;
  --alert:#B42318;
  --alert-soft:#FDECEA;
  --r:10px;
  --r-lg:14px;
  --shadow:0 1px 2px rgba(20,33,58,.06), 0 8px 24px -12px rgba(20,33,58,.18);
  --font:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
svg{width:18px;height:18px;flex:none}
svg.big{width:28px;height:28px}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.25}
h2{font-size:18px}
h3{font-size:16px}
p{margin:0}
a{color:var(--brand-2);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none !important}

/* ============ каркас ============ */
.flag{height:3px;display:flex}
.flag i{flex:1}
.flag i:nth-child(1){background:#fff}
.flag i:nth-child(2){background:var(--brand)}
.flag i:nth-child(3){background:#C7332B}

.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1440px;margin:0 auto;padding:0 24px;
  height:62px;display:flex;align-items:center;gap:18px;
}
.logo{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
.logo-mark{
  width:34px;height:34px;border-radius:8px;flex:none;
  background:var(--brand);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:15px;
}
.logo-txt b{display:block;font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.logo-txt span{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.02em}
.spacer{flex:1}

.roleswitch{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.roleswitch button{
  border:0;background:transparent;color:var(--ink-2);
  padding:6px 13px;border-radius:6px;font-size:13px;font-weight:550;
}
.roleswitch button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 2px rgba(20,33,58,.12)}

.icon-btn{
  position:relative;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);display:grid;place-items:center;color:var(--ink-2);
}
.icon-btn:hover{background:var(--bg)}
.dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:#C7332B;border:2px solid #fff}
.me{display:flex;align-items:center;gap:9px;padding-left:14px;border-left:1px solid var(--line)}
.ava{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:650;font-size:13px}
.me small{display:block;color:var(--ink-3);font-size:11.5px;line-height:1.3}
.me b{font-size:13px;font-weight:600}

.shell{max-width:1440px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:236px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:86px;padding:22px 0 40px}
.side-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:650;padding:0 12px 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;
  color:var(--ink-2);font-size:14px;font-weight:550;
}
.nav a:hover{background:#E7ECF4;text-decoration:none;color:var(--ink)}
.nav a.on{background:var(--brand);color:#fff}
.nav a.on svg{opacity:1}
.nav svg{width:18px;height:18px;flex:none;opacity:.72}
.nav .cnt{margin-left:auto;background:#E1E7F1;color:var(--ink-2);border-radius:20px;font-size:11.5px;padding:1px 7px;font-weight:650}
.nav a.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.side-note{margin:18px 8px 0;padding:13px;background:var(--brand-soft);border-radius:var(--r);font-size:12.5px;color:#1D4E9E;line-height:1.45}
.side-note b{display:block;margin-bottom:3px}

.main{padding:24px 0 70px;min-width:0}
.crumbs{font-size:12.5px;color:var(--ink-3);margin-bottom:10px;display:flex;gap:7px;align-items:center}
.crumbs span{cursor:pointer}
.crumbs span:hover{color:var(--brand-2)}
.page-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:22px}
.page-head p{color:var(--ink-2);font-size:14px;margin-top:5px;max-width:620px}
.page-head .spacer{flex:1}

/* ============ элементы ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.card.pad0{padding:0;overflow:hidden}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.card-head h2{font-size:16px}
.card-head .spacer{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:650;color:var(--ink-3)}
.hr{height:1px;background:var(--line-2);margin:16px 0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:9px 16px;border-radius:9px;font-weight:600;font-size:14px;
}
.btn:hover{background:var(--bg)}
.btn-p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-p:hover{background:#0E3573}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn-lg{padding:12px 22px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.btn-block{width:100%}

.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.b-gray{background:#EEF1F6;color:var(--ink-2)}
.b-blue{background:var(--brand-soft);color:#1D4E9E}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-alert{background:var(--alert-soft);color:var(--alert)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border:1px solid var(--line);border-radius:20px;font-size:12.5px;color:var(--ink-2);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:7px}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:17px 18px}
.stat .k{font-size:12.5px;color:var(--ink-2);font-weight:550}
.stat .v{font-size:28px;font-weight:680;letter-spacing:-.03em;margin-top:5px;line-height:1}
.stat .s{font-size:12.5px;color:var(--ink-3);margin-top:6px}

.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.input,select.input{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;
  font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);
}
.input:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(44,107,232,.13)}
.input[readonly]{background:var(--bg);color:var(--ink-2)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-3)}
.search .input{padding-left:37px}

table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-3);font-weight:650;padding:11px 16px;border-bottom:1px solid var(--line);background:#FAFBFD;
}
td{padding:13px 16px;border-bottom:1px solid var(--line-2);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFBFD}

/* ============ подпись макета: рельс статуса ============ */
.rail{display:flex;align-items:flex-start;margin:6px 0 2px}
.rail .node{flex:1;position:relative;text-align:center;padding-top:22px}
.rail .node::before{
  content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);
  width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--line);z-index:2;
}
.rail .node::after{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:var(--line);z-index:1}
.rail .node:first-child::after{display:none}
.rail .node.done::before{background:var(--ok);border-color:var(--ok)}
.rail .node.done::after{background:var(--ok)}
.rail .node.now::before{background:var(--brand-2);border-color:var(--brand-2);box-shadow:0 0 0 4px rgba(44,107,232,.18)}
.rail .node.now::after{background:var(--ok)}
.rail .node.stop::before{background:var(--alert);border-color:var(--alert)}
.rail .node.stop::after{background:var(--alert)}
.rail .node b{display:block;font-size:12px;font-weight:600;color:var(--ink-3);line-height:1.3}
.rail .node.done b,.rail .node.now b,.rail .node.stop b{color:var(--ink)}
.rail .node small{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}

/* ============ карточки вузов ============ */
.org{display:flex;gap:16px;padding:18px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.org:hover{border-color:#C3D0E4;box-shadow:var(--shadow)}
.org-logo{
  width:52px;height:52px;flex:none;border-radius:11px;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:-.02em;
}
.org-body{flex:1;min-width:0}
.org h3{font-size:15.5px;cursor:pointer}
.org h3:hover{color:var(--brand-2)}
.org-meta{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.req{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap}
.req div{font-size:12.5px;color:var(--ink-3)}
.req b{display:block;font-size:15px;color:var(--ink);font-weight:650;margin-top:1px}
.org-side{display:flex;flex-direction:column;gap:8px;align-items:flex-end;justify-content:center;flex:none}

/* ============ шаги мастера ============ */
.steps{display:flex;gap:8px;margin-bottom:22px}
.step{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);opacity:.6}
.step.on{opacity:1;border-color:var(--brand);box-shadow:0 0 0 3px rgba(18,62,140,.09)}
.step.past{opacity:1}
.step .n{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.06em}
.step.on .n{color:var(--brand)}
.step b{display:block;font-size:13.5px;margin-top:2px}

.pick{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.pick:last-child{border-bottom:0}
.pick input{width:17px;height:17px;accent-color:var(--brand);cursor:pointer;flex:none}
.prio{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}

/* ============ расписание ============ */
.week-wrap{overflow-x:auto;padding-bottom:4px}
.week{display:grid;min-width:0;grid-template-columns:64px repeat(6,minmax(0,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.week>div{background:var(--surface);padding:9px 10px;min-height:44px}
.week .wh{background:#FAFBFD;font-size:12px;font-weight:650;text-align:center;color:var(--ink-2);min-height:auto;padding:10px}
.week .wt{background:#FAFBFD;font-size:11.5px;color:var(--ink-3);text-align:center;font-weight:600}
.les{border-left:3px solid var(--brand-2);padding-left:8px !important}
.les.lab{border-left-color:#0F7A4D}
.les.lec{border-left-color:#9A6100}
.les b{display:block;font-size:12.5px;font-weight:600;line-height:1.3}
.les small{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}

/* ============ прочее ============ */
.bar{height:7px;background:var(--line-2);border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand-2);border-radius:20px}
.doc{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.doc:last-child{border-bottom:0}
.doc-ic{width:38px;height:38px;border-radius:9px;background:var(--bg);display:grid;place-items:center;color:var(--ink-2);flex:none}
.doc-b{flex:1;min-width:0}
.doc-b b{font-size:14px;font-weight:600;display:block}
.ach{display:flex;gap:12px;padding:13px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.ach-ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;font-size:17px}
.empty{text-align:center;padding:46px 20px;color:var(--ink-2)}
.empty svg{width:42px;height:42px;color:var(--ink-3);margin-bottom:10px}

.modal-bg{position:fixed;inset:0;background:rgba(20,33,58,.42);z-index:90;display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border-radius:16px;max-width:520px;width:100%;padding:26px;box-shadow:0 24px 60px -12px rgba(20,33,58,.4)}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:100;
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:11px;font-size:14px;font-weight:550;
  box-shadow:0 12px 30px -8px rgba(20,33,58,.5);animation:up .22s ease;
}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}

/* ============ вход ============ */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login-l{background:var(--brand);color:#fff;padding:52px;display:flex;flex-direction:column;justify-content:space-between;
  background-image:radial-gradient(circle at 88% 12%,rgba(255,255,255,.09),transparent 46%)}
.login-l h2{font-size:33px;font-weight:680;letter-spacing:-.025em;line-height:1.18;max-width:430px}
.login-l p{opacity:.78;margin-top:16px;max-width:400px;font-size:15px}
.login-facts{display:flex;gap:36px;margin-top:36px}
.login-facts b{display:block;font-size:26px;font-weight:680;letter-spacing:-.02em}
.login-facts span{font-size:12.5px;opacity:.7}
.login-r{display:grid;place-items:center;padding:40px}
.login-box{width:100%;max-width:352px}
.gosuslugi{background:#0D4CD3;border-color:#0D4CD3;color:#fff}
.gosuslugi:hover{background:#0A3EAD}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:12.5px;margin:18px 0}
.or::before,.or::after{content:"";height:1px;background:var(--line);flex:1}

/* ============ адаптив ============ */
@media (max-width:1080px){
  .split{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:0;padding:0 16px}
  .side{position:static;padding:14px 0 0}
  .side-label,.side-note{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .nav a{white-space:nowrap;background:var(--surface);border:1px solid var(--line)}
  .g2,.g3{grid-template-columns:1fr}
  .login{grid-template-columns:1fr}
  .login-l{display:none}
  .topbar-in{padding:0 16px;gap:12px}
  .me small,.logo-txt span{display:none}
  .steps{overflow-x:auto}
  .step{min-width:150px}
  .week{font-size:12px;min-width:700px}
  .rail{overflow-x:auto}
  .rail .node{min-width:96px}
}

/* ============ добавлено во второй версии ============ */
.langswitch{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.langswitch button{border:0;background:transparent;color:var(--ink-2);padding:6px 12px;border-radius:6px;font-size:12.5px;font-weight:650;letter-spacing:.03em}
.langswitch button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 2px rgba(20,33,58,.12)}

.nextstep{display:flex;gap:16px;align-items:center;border:1px solid;border-radius:var(--r-lg);padding:18px 20px}
.ns-ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.75);display:grid;place-items:center;flex:none}
.ns-ic svg{width:22px;height:22px}

.progs{margin-top:15px;border-top:1px solid var(--line-2)}
.prog{display:flex;align-items:center;gap:18px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.prog:last-child{border-bottom:0}
.prog b{font-size:14px;font-weight:600}
.pv{min-width:104px}
.pv span{display:block;font-size:11px;color:var(--ink-3);line-height:1.3}
.pv b{font-size:14px}

.src{font-size:11.5px;color:var(--ink-3);display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.src svg{width:14px;height:14px;margin-top:1px;opacity:.8}
.card .src+.src{margin-top:5px}

.cmp-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.cmp{min-width:680px}
.cmp th{vertical-align:top;padding:16px;background:var(--surface);border-bottom:1px solid var(--line);text-transform:none;letter-spacing:0}
.cmp td{padding:13px 16px;font-size:13.5px}
.cmp .k{background:#FAFBFD;font-size:12.5px;color:var(--ink-2);font-weight:600;width:216px;position:sticky;left:0;z-index:2}
.best{color:var(--ok)}
.best::after{content:" ✓";font-size:11px;vertical-align:1px}

.how{display:grid;gap:13px;max-width:520px}
.how-i{display:flex;gap:12px;align-items:flex-start}
.how-i>span{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none;margin-top:1px}
.how-i b{display:block;font-size:13.5px;font-weight:600}
.how-i small{display:block;font-size:12px;opacity:.66;line-height:1.45;margin-top:1px}

.preview{border:1px solid var(--line-2);border-radius:var(--r);padding:15px;background:#FAFBFD;opacity:.72;pointer-events:none;filter:saturate(.65)}
.mini{width:100%}
.mini td{padding:8px 10px;font-size:12.5px;border-bottom:1px solid var(--line-2)}
.mini td:last-child{text-align:right}
.mini-week{display:grid;grid-template-columns:56px repeat(3,minmax(0,1fr));gap:9px}
.mini-week>div{font-size:12px;color:var(--ink-2)}
.mini-week b{display:block;font-weight:600;color:var(--ink)}
.mini-week small{color:var(--ink-3)}
.mini-acts{display:grid;gap:11px}
.mini-acts>div{font-size:12.5px;font-weight:600}
.mini-acts small{display:block;color:var(--ink-3);font-weight:400;margin-top:1px}

.login-l{overflow-y:auto}
.login-l h2{font-size:30px}
.nav .cnt{text-transform:lowercase}

@media (max-width:900px){
  .nextstep{flex-direction:column;align-items:flex-start;gap:12px}
  .prog{flex-wrap:wrap;gap:10px 18px}
  .pv{min-width:88px}
}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ======================================================================
   Студент.РФ — макет платформы поступления (RU/EN, без backend)
   ====================================================================== */

function save(o,c){
  const i=S.saved.findIndex(x=>x.o===o&&x.c===c);
  if(i<0){
    if(S.saved.length>=5) return toast(LANG?'Up to 5 programs in one application':'В одном заявлении не больше 5 программ');
    S.saved.push({o,c}); toast(LANG?'Saved to your admission list':'Сохранено в список поступления');
  } else { S.saved.splice(i,1); toast(LANG?'Removed from the list':'Убрано из списка'); }
  render();
}

  const items=S.saved.map(x=>({o:org(x.o),s:prog(x.o,x.c)}));

        <span class="tiny muted num" style="text-transform:none;letter-spacing:0">${L(i.o,'abbr')} · ${i.s.code}</span>
        <button class="btn btn-sm" style="margin-top:9px;width:100%" onclick="save('${i.o.id}','${i.s.code}')">
          ${LANG?'Remove':'Убрать'}</button></th>`).join('')}

      ${items.map(i=>`<td>${fn(i)}</td>`).join('')}</tr>`).join('')}

       [LANG?'v1.1 — Admission office view':'v1.1 — Кабинет приёмной комиссии',LANG?'Incoming applications, document verification, ranking lists.'
                                                     :'Входящие заявления, проверка документов, конкурсные списки.','blue'],
       [LANG?'v2 — Student account':'v2 — Кабинет студента',LANG?'Activities and volunteer hours first, then grades and timetable via integrations.'
                                                     :'Сначала активности и волонтёрские часы, затем оценки и расписание через интеграции.','gray']].map(([k,v,c])=>`
      <div style="display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-2)">
        <span class="badge b-${c}" style="min-width:190px"><i></i>${k}</span>
        <div class="tiny muted" style="padding-top:2px">${v}</div>
      </div>`).join('')}
  </div>`;
}

/* ======================================================================
   Подвал и роутер
   ====================================================================== */
function footer(){
  const links=LANG?['About the platform','Admission rules','Support','Data policy']
                  :['О платформе','Правила приёма','Поддержка','Политика обработки данных'];
  return `<footer style="margin-top:44px;padding-top:22px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px">
    <div style="display:flex;gap:26px;flex-wrap:wrap;margin-bottom:12px">
      ${links.map(l=>`<a href="#" onclick="event.preventDefault()">${l}</a>`).join('')}</div>
    <p>${t('brand')} — ${t('tagline')}. ${t('demo')}</p>
  </footer>`;
}

const SCREENS={home:scrHome,catalog:scrCatalog,org:scrOrg,compare:scrCompare,portfolio:scrPortfolio,
               apply:scrApply,apps:scrApps,app:scrApp,news:scrNews,future:scrFuture};

function render(){
  const root=document.getElementById('root');
  if(!S.logged){ root.innerHTML=scrLogin(); return; }
  root.innerHTML=shell((SCREENS[S.route]||scrHome)()+footer());
  const s=document.querySelector('.search .input');
  if(s&&S.filter.q){ s.focus(); s.setSelectionRange(s.value.length,s.value.length); }
}
render();

</script>
</body>
</html>
